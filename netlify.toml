# Netlify configuration for ordain.art

[build]
  publish = "."

# Clean URLs (no .html extensions)
[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/colophon"
  to = "/colophon.html"
  status = 200

[[redirects]]
  from = "/voting"
  to = "/voting.html"
  status = 200

[[redirects]]
  from = "/wallets"
  to = "/wallets.html"
  status = 200

[[redirects]]
  from = "/success"
  to = "/success.html"
  status = 200

[[redirects]]
  from = "/notify-success"
  to = "/notify-success.html"
  status = 200

[[redirects]]
  from = "/bff26"
  to = "/bff26.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"